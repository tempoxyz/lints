name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The version PR is opened with a short-lived GitHub App token minted via
# the github-sts action (authorized by .github/sts/changesets.sts.yaml); the
# built-in GITHUB_TOKEN is not allowed to create pull requests. It keeps
# contents: write for the tag push and gh release create in the follow-up
# step, which the org setting does not affect.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests and linting
        run: |
          pnpm test
          pnpm lint

      - name: Fetch GitHub token via STS
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@183a02178c660ce295e9a262edc5857cb7135f06 # main
        with:
          policy: changesets

      - name: Create Release PR or Tag
        id: changesets
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1.7.0
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ steps.sts.outputs.token }}

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        run: |
          # Get the version from package.json
          VERSION=$(jq -r '.version' package.json)
          TAG="v${VERSION}"
          CHANGESET_TAG="@tempoxyz/lints@${VERSION}"

          # Changesets creates tags like @tempoxyz/lints@0.1.1
          # We need to create vX.Y.Z tags for GitHub Actions compatibility
          echo "Looking for changeset tag: $CHANGESET_TAG"

          # Wait for changeset tag to be available
          MAX_ATTEMPTS=10
          SLEEP_SECONDS=2
          for i in $(seq 1 $MAX_ATTEMPTS); do
            git fetch --tags origin
            if git rev-parse "$CHANGESET_TAG" >/dev/null 2>&1; then
              echo "Changeset tag $CHANGESET_TAG found"
              break
            fi
            if [ $i -eq $MAX_ATTEMPTS ]; then
              echo "Error: Tag $CHANGESET_TAG not found after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: Tag not yet available, waiting..."
            sleep $SLEEP_SECONDS
          done

          # Create the vX.Y.Z tag pointing to the same commit
          echo "Creating tag $TAG from $CHANGESET_TAG"
          git tag "$TAG" "$CHANGESET_TAG"
          git push origin "$TAG"

          # Create GitHub release using the vX.Y.Z tag
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
